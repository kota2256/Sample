<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	
	<!--CSS読み込み-->
	<link rel="stylesheet" th:href="@{/css/login/login.css}">
	
    <title>ログイン</title>
  </head>
  <body class="bg-light">
	<div class="text-center">
		<form method="post" th:action="@{/login}" class="form-login">	<!--form-login：css指定-->
			<h2>ログイン</h2>
			<!--ユーザーID-->
			<div class="mb-3">	
				<label for="userId" class="visually-hidden">userId</label>
				<input type="text" id="userId" name="userId" placeholder="ユーザーID" class="form-control"/>
			</div>
			<!--パスワード-->
			<div class="mb-3">
				<label for="password" class="visually-hidden">パスワード</label>
				<input type="text" id="password" name="password" placeholder="パスワード" class="form-control"/>
			</div>
			<!--ログインボタン-->
			<input type="submit" value="ログイン" class="btn btn-primary">
		</form>
		<a th:href="@{/user/signup}">新規登録はこちら</a>
	</div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

  </body>
</html>
