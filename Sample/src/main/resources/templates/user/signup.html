<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	
	<!--CSS読み込み-->
	<link rel="stylesheet" th:href="@{/css/user/signup.css}">
	
    <titleユーザー登録</title>
  </head>
  <body class="bg-light">
	<form id="signup-form" method="post" th:action="@{/user/signup}" th:object="${signupForm}" class="form-signup">	<!--form-signup：css指定-->
		<h1 class="text-center">ユーザー登録</h1>
		<!--ユーザーID-->
		<div class="mb-3">	
			<label for="userId">ユーザーID</label>
			<input type="text" th:field="*{userId}" class="form-control" th:errorclass="is-invalid"/>	<!-- th:fieldはidとname属性に変換される -->
			<div class="invalid-feedback" th:errors="*{userId}"></div>
		</div>
		<!--パスワード-->
		<div class="mb-3">
			<label for="password">パスワード</label>
			<input type="text" th:field="*{password}" class="form-control" th:errorclass="is-invalid"/>
			<div class="invalid-feedback" th:errors="*{password}"></div>
		</div>
		<!--ユーザー名-->
		<div class="mb-3">
			<label for="userName">ユーザー名</label>
			<input type="text" th:field="*{userName}" class="form-control" th:errorclass="is-invalid"/>
			<div class="invalid-feedback" th:errors="*{userName}"></div>
		</div>
		<!--誕生日-->
		<div class="mb-3">
			<label for="birthday">誕生日</label>
			<input type="text" th:field="*{birthday}" placeholder="yyyy/MM/dd" class="form-control" th:errorclass="is-invalid"/>
			<div class="invalid-feedback" th:errors="*{birthday}"></div>
		</div>
		<!--年齢-->
		<div class="mb-3">
			<label for="age">年齢</label>
			<input type="text" th:field="*{age}" class="form-control" th:errorclass="is-invalid"/>
			<div class="invalid-feedback" th:errors="*{age}"></div>
		</div>
		<!--性別-->
		<div  class="mb-3">
			<div th:each="item : ${genderMap}" class="form-check-inline">		<!-- form-check 要素を「インライン（横並び）」にするクラス-->
				<input type="radio"  th:field="*{gender}" class="form-check-input" th:value="${item.value}" th:errorclass="is-invalid"/>	<!--value：初期表示及び送信時にnameとともに値送信-->
				<label for="gender" th:text="${item.key}" class="form-check-label"></label>
			</div>
			<div class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
		</div>
		<!--登録ボタン-->
		<input type="submit" value="ユーザー登録" class="btn btn-primary w-100 mt-3">
	</form>
	

    <!-- Option 1: Bootstrap Bundle with Popper -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

  </body>
</html>
